<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker Ultimate v3.0</title>
  <style>
    :root[data-theme="dark"] {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --header-bg: #1a2336;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border-color: #243048;
      --input-bg: #0b0f19;
    }

    :root[data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --header-bg: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      max-width: 1380px;
      margin: 0 auto;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    h1 {
      color: var(--accent);
      font-size: 26px;
      letter-spacing: -0.5px;
    }

    /* Stats Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .stat-number {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    /* Progress Bar */
    .progress-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .progress-bar-container {
      background-color: var(--input-bg);
      border-radius: 9999px;
      height: 12px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent), var(--success));
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
    }

    /* Controls Panel */
    .control-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 992px) {
      .control-panel {
        grid-template-columns: 1.2fr 1fr 0.8fr;
      }
    }

    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .panel-card h3 {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    input, select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--input-bg);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
      font-size: 11px;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .btn-secondary {
      background-color: var(--header-bg);
      color: var(--text-main);
    }

    /* Priority Badges */
    .badge-priority {
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .p-high { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
    .p-medium { background-color: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .p-low { background-color: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    /* Tables & Cards */
    .subject-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .subject-header {
      background-color: var(--header-bg);
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-block {
      padding: 16px 18px;
      border-bottom: 1px dashed var(--border-color);
    }

    .book-block:last-child {
      border-bottom: none;
    }

    .book-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12px;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Status Buttons */
    .status-btn {
      padding: 5px 8px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      width: 95px;
      text-align: center;
    }

    .status-not-done {
      background-color: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .status-in-progress {
      background-color: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .status-done {
      background-color: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .due-alert {
      font-size: 10px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 2px 4px;
      border-radius: 3px;
      display: inline-block;
      margin-top: 2px;
    }

    /* Print Formatting */
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .control-panel, header button, .btn-danger, .stats-grid { display: none !important; }
      .subject-card { border: 1px solid #ccc; page-break-inside: avoid; }
      th, td { border-bottom: 1px solid #eee; }
      .status-btn { border: 1px solid #aaa; color: #000 !important; background: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Study Tracker Ultimate</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Advanced Revision & Chapter Management</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="btn-secondary" onclick="toggleTheme()">🌓 Toggle Theme</button>
      <button class="btn-secondary" onclick="window.print()">🖨️ Print / Save PDF</button>
    </div>
  </header>

  <!-- Top Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 11px;">TOTAL CHAPTERS</div>
      <div class="stat-number" id="stat-chapters">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 11px;">COMPLETED</div>
      <div class="stat-number" style="color: var(--success);" id="stat-completed">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 11px;">IN PROGRESS</div>
      <div class="stat-number" style="color: var(--warning);" id="stat-progress">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 11px;">REVISION DUE</div>
      <div class="stat-number" style="color: var(--danger);" id="stat-due">0</div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 13px;">
      <span>Overall Preparation Level</span>
      <span id="progress-percent" style="color: var(--accent);">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- Control Panel -->
  <div class="control-panel">
    <!-- Add Chapter Form -->
    <div class="panel-card">
      <h3>Add New Chapter</h3>
      <form id="add-chapter-form" onsubmit="addEntry(event)">
        <div class="form-grid">
          <input type="text" id="subject-input" placeholder="Subject" required>
          <input type="text" id="book-input" placeholder="Book" required>
          <input type="text" id="chapter-input" placeholder="Chapter Name" required style="grid-column: 1 / -1;">
          <select id="priority-input">
            <option value="HIGH">High Priority</option>
            <option value="MEDIUM" selected>Medium Priority</option>
            <option value="LOW">Low Priority</option>
          </select>
          <input type="date" id="date-input">
          <button type="submit" style="grid-column: 1 / -1;">+ Add Chapter</button>
        </div>
      </form>
    </div>

    <!-- Filter Options -->
    <div class="panel-card">
      <h3>Search & Filter</h3>
      <div class="form-grid">
        <select id="filter-subject" onchange="renderTracker()">
          <option value="ALL">All Subjects</option>
        </select>
        <select id="filter-priority" onchange="renderTracker()">
          <option value="ALL">All Priorities</option>
          <option value="HIGH">High Priority</option>
          <option value="MEDIUM">Medium Priority</option>
          <option value="LOW">Low Priority</option>
        </select>
        <select id="filter-status" onchange="renderTracker()">
          <option value="ALL">All Statuses</option>
          <option value="DONE">Completed</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="NOT_STARTED">Not Started</option>
        </select>
        <input type="text" id="search-input" placeholder="Search chapters..." oninput="renderTracker()">
      </div>
    </div>

    <!-- Custom Columns & Backup -->
    <div class="panel-card">
      <h3>Customization & Backup</h3>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 4px;">
          <input type="text" id="custom-task-input" placeholder="Add Custom Task Column" style="flex: 1;">
          <button onclick="addCustomTaskColumn()">+ Column</button>
        </div>
        <div style="display: flex; gap: 6px; margin-top: 4px;">
          <button class="btn-secondary" onclick="exportData()" style="flex: 1;">Export JSON</button>
          <button class="btn-secondary" onclick="document.getElementById('import-file').click()" style="flex: 1;">Import JSON</button>
          <input type="file" id="import-file" style="display: none;" onchange="importData(event)" accept=".json">
        </div>
      </div>
    </div>
  </div>

  <!-- Tracker Output Container -->
  <div id="tracker-container"></div>

  <script>
    let studyData = JSON.parse(localStorage.getItem('studyTrackerV3Data')) || [];
    let customTasks = JSON.parse(localStorage.getItem('studyTrackerV3CustomTasks')) || [
      { key: 'notes', label: 'Notes' },
      { key: 'revision', label: 'Revision' },
      { key: 'questionPractice', label: 'Q-Practice' },
      { key: 'mockTest', label: 'Mock Test' },
      { key: 'extraPractice', label: 'Extra Practice' }
    ];

    const STATUS_STATES = {
      0: { label: 'Not Started', class: 'status-not-done' },
      1: { label: 'In Progress', class: 'status-in-progress' },
      2: { label: 'Done', class: 'status-done' }
    };

    function saveData() {
      localStorage.setItem('studyTrackerV3Data', JSON.stringify(studyData));
      localStorage.setItem('studyTrackerV3CustomTasks', JSON.stringify(customTasks));
      populateSubjectFilter();
      renderTracker();
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
    }

    function addEntry(e) {
      e.preventDefault();
      
      const subjectName = document.getElementById('subject-input').value.trim();
      const bookName = document.getElementById('book-input').value.trim();
      const chapterName = document.getElementById('chapter-input').value.trim();
      const priority = document.getElementById('priority-input').value;
      const targetDate = document.getElementById('date-input').value;

      let subject = studyData.find(s => s.name.toLowerCase() === subjectName.toLowerCase());
      if (!subject) {
        subject = { id: 's_' + Date.now(), name: subjectName, books: [] };
        studyData.push(subject);
      }

      let book = subject.books.find(b => b.name.toLowerCase() === bookName.toLowerCase());
      if (!book) {
        book = { id: 'b_' + Date.now(), name: bookName, chapters: [] };
        subject.books.push(book);
      }

      const tasksObj = {};
      customTasks.forEach(t => tasksObj[t.key] = 0);

      const chapter = {
        id: 'c_' + Date.now(),
        name: chapterName,
        priority: priority,
        targetDate: targetDate || '',
        lastUpdated: null,
        tasks: tasksObj
      };

      book.chapters.push(chapter);
      document.getElementById('chapter-input').value = '';
      saveData();
    }

    function addCustomTaskColumn() {
      const input = document.getElementById('custom-task-input');
      const label = input.value.trim();
      if (!label) return;

      const key = 'custom_' + Date.now();
      customTasks.push({ key, label });

      // Backfill existing chapters with 0
      studyData.forEach(s => s.books.forEach(b => b.chapters.forEach(c => {
        if (c.tasks[key] === undefined) c.tasks[key] = 0;
      })));

      input.value = '';
      saveData();
    }

    function cycleTaskStatus(subjectId, bookId, chapterId, taskKey) {
      const subject = studyData.find(s => s.id === subjectId);
      const book = subject.books.find(b => b.id === bookId);
      const chapter = book.chapters.find(c => c.id === chapterId);

      if (!chapter.tasks[taskKey]) chapter.tasks[taskKey] = 0;
      chapter.tasks[taskKey] = (chapter.tasks[taskKey] + 1) % 3;
      chapter.lastUpdated = new Date().toISOString();

      saveData();
    }

    function isRevisionDue(lastUpdated) {
      if (!lastUpdated) return false;
      const days = (new Date() - new Date(lastUpdated)) / (1000 * 60 * 60 * 24);
      return days >= 14; // Due if completed/updated over 14 days ago
    }

    function deleteChapter(subjectId, bookId, chapterId) {
      const subject = studyData.find(s => s.id === subjectId);
      const book = subject.books.find(b => b.id === bookId);
      book.chapters = book.chapters.filter(c => c.id !== chapterId);

      if (book.chapters.length === 0) subject.books = subject.books.filter(b => b.id !== bookId);
      if (subject.books.length === 0) studyData = studyData.filter(s => s.id !== subjectId);

      saveData();
    }

    function deleteSubject(subjectId) {
      if (confirm('Delete this subject and all its chapters?')) {
        studyData = studyData.filter(s => s.id !== subjectId);
        saveData();
      }
    }

    function populateSubjectFilter() {
      const filterSelect = document.getElementById('filter-subject');
      const currentValue = filterSelect.value;
      filterSelect.innerHTML = '<option value="ALL">All Subjects</option>';

      studyData.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject.id;
        option.textContent = subject.name;
        filterSelect.appendChild(option);
      });

      filterSelect.value = currentValue;
    }

    function getChapterOverallStatus(tasks) {
      const values = Object.values(tasks);
      if (values.every(v => v === 2)) return 'DONE';
      if (values.every(v => v === 0)) return 'NOT_STARTED';
      return 'IN_PROGRESS';
    }

    function updateStatsAndProgress() {
      let totalChapters = 0, completedChapters = 0, inProgressChapters = 0, dueRevisions = 0;
      let totalWeight = 0, completedWeight = 0;

      studyData.forEach(s => s.books.forEach(b => b.chapters.forEach(c => {
        totalChapters++;
        const status = getChapterOverallStatus(c.tasks);
        if (status === 'DONE') completedChapters++;
        if (status === 'IN_PROGRESS') inProgressChapters++;
        if (status === 'DONE' && isRevisionDue(c.lastUpdated)) dueRevisions++;

        Object.values(c.tasks).forEach(v => {
          totalWeight += 2;
          completedWeight += v;
        });
      })));

      document.getElementById('stat-chapters').innerText = totalChapters;
      document.getElementById('stat-completed').innerText = completedChapters;
      document.getElementById('stat-progress').innerText = inProgressChapters;
      document.getElementById('stat-due').innerText = dueRevisions;

      const percentage = totalWeight === 0 ? 0 : Math.round((completedWeight / totalWeight) * 100);
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('progress-percent').innerText = percentage + '%';
    }

    function renderTracker() {
      const container = document.getElementById('tracker-container');
      container.innerHTML = '';

      const selectedSubject = document.getElementById('filter-subject').value;
      const selectedPriority = document.getElementById('filter-priority').value;
      const selectedStatus = document.getElementById('filter-status').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

      let hasVisibleData = false;

      studyData.forEach(subject => {
        if (selectedSubject !== 'ALL' && subject.id !== selectedSubject) return;

        let booksHTML = '';

        subject.books.forEach(book => {
          let chaptersHTML = '';

          book.chapters.forEach(chapter => {
            const matchesSearch = chapter.name.toLowerCase().includes(searchQuery);
            const matchesPriority = selectedPriority === 'ALL' || chapter.priority === selectedPriority;
            const chapterStatus = getChapterOverallStatus(chapter.tasks);
            const matchesStatus = selectedStatus === 'ALL' || chapterStatus === selectedStatus;

            if (matchesSearch && matchesPriority && matchesStatus) {
              let customTasksHTML = '';
              customTasks.forEach(t => {
                const val = chapter.tasks[t.key] || 0;
                customTasksHTML += `<td>${renderStatusBtn(subject.id, book.id, chapter.id, t.key, val)}</td>`;
              });

              const revisionAlert = (chapterStatus === 'DONE' && isRevisionDue(chapter.lastUpdated))
                ? `<div class="due-alert">⚠️ Revision Due</div>` : '';

              chaptersHTML += `
                <tr>
                  <td>
                    <span class="badge-priority p-${chapter.priority ? chapter.priority.toLowerCase() : 'medium'}">${chapter.priority || 'MEDIUM'}</span>
                    <strong>${chapter.name}</strong>
                    ${chapter.targetDate ? `<div style="font-size:10px; color:var(--text-muted);">Target: ${chapter.targetDate}</div>` : ''}
                    ${revisionAlert}
                  </td>
                  ${customTasksHTML}
                  <td>
                    <button class="btn-danger" onclick="deleteChapter('${subject.id}', '${book.id}', '${chapter.id}')">Remove</button>
                  </td>
                </tr>
              `;
            }
          });

          if (chaptersHTML !== '') {
            hasVisibleData = true;

            let dynamicHeaders = '';
            customTasks.forEach(t => dynamicHeaders += `<th>${t.label}</th>`);

            booksHTML += `
              <div class="book-block">
                <div class="book-title">📖 Book: ${book.name}</div>
                <div class="table-responsive">
                  <table>
                    <thead>
                      <tr>
                        <th>Chapter</th>
                        ${dynamicHeaders}
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>${chaptersHTML}</tbody>
                  </table>
                </div>
              </div>
            `;
          }
        });

        if (booksHTML !== '') {
          const subjectEl = document.createElement('div');
          subjectEl.className = 'subject-card';
          subjectEl.innerHTML = `
            <div class="subject-header">
              <h2>📚 ${subject.name}</h2>
              <button class="btn-danger" onclick="deleteSubject('${subject.id}')">Delete Subject</button>
            </div>
            ${booksHTML}
          `;
          container.appendChild(subjectEl);
        }
      });

      if (!hasVisibleData) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px;">No matching chapters found.</p>`;
      }

      updateStatsAndProgress();
    }

    function renderStatusBtn(subjectId, bookId, chapterId, taskKey, statusVal) {
      const stateInfo = STATUS_STATES[statusVal || 0];
      return `<button class="status-btn ${stateInfo.class}" onclick="cycleTaskStatus('${subjectId}', '${bookId}', '${chapterId}', '${taskKey}')">${stateInfo.label}</button>`;
    }

    function exportData() {
      const payload = { studyData, customTasks };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `study_tracker_v3_backup.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const fileReader = new FileReader();
      fileReader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.studyData && imported.customTasks) {
            studyData = imported.studyData;
            customTasks = imported.customTasks;
          } else if (Array.isArray(imported)) {
            studyData = imported;
          }
          saveData();
          alert('Data imported successfully!');
        } catch (err) {
          alert('Invalid JSON file format.');
        }
      };
      if (e.target.files[0]) {
        fileReader.readAsText(e.target.files[0]);
      }
    }

    // Init
    populateSubjectFilter();
    renderTracker();
  </script>
</body>
</html>
