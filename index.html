<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Study & Chapter Tracker</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-hover: #1c263b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border-color: #243048;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
      animation: fadeInDown 0.6s ease;
    }

    h1 {
      color: var(--accent);
      font-size: 28px;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    /* Stats Overview Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      animation: fadeIn 0.8s ease;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    .progress-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      animation: fadeIn 0.8s ease;
    }

    .progress-bar-container {
      background-color: #1e293b;
      border-radius: 9999px;
      height: 14px;
      overflow: hidden;
      margin-top: 10px;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      height: 100%;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Control Panel */
    .control-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 24px;
      animation: fadeInUp 0.8s ease;
    }

    @media (min-width: 850px) {
      .control-panel {
        grid-template-columns: 1.2fr 1fr;
      }
    }

    .panel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
    }

    .panel-card h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    input, select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0b0f19;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    button {
      background-color: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #fff;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid var(--danger);
      padding: 5px 10px;
      font-size: 12px;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #fff;
    }

    .btn-secondary {
      background-color: #243048;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    /* Subject Cards & Animations */
    .subject-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 24px;
      overflow: hidden;
      animation: scaleUp 0.4s ease;
      transition: border-color 0.2s;
    }

    .subject-header {
      background-color: #1a2336;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subject-header h2 {
      font-size: 18px;
      color: #fff;
    }

    .book-block {
      padding: 18px 20px;
      border-bottom: 1px dashed var(--border-color);
    }

    .book-block:last-child {
      border-bottom: none;
    }

    .book-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
    }

    /* Animated Status Buttons */
    .status-btn {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      width: 105px;
      text-align: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-not-done {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .status-in-progress {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    .status-done {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.4);
    }

    .status-btn:hover {
      transform: scale(1.05);
    }

    /* Keyframe Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleUp {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Study Tracker Pro</h1>
    <p style="color: var(--text-muted); font-size: 14px;">Organize subjects, books, chapters, and revision targets</p>
  </header>

  <!-- Top Stats Overview -->
  <div class="stats-grid">
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 12px;">TOTAL CHAPTERS</div>
      <div class="stat-number" id="stat-chapters">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 12px;">COMPLETED</div>
      <div class="stat-number" style="color: var(--success);" id="stat-completed">0</div>
    </div>
    <div class="stat-card">
      <div style="color: var(--text-muted); font-size: 12px;">IN PROGRESS</div>
      <div class="stat-number" style="color: var(--warning);" id="stat-progress">0</div>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrapper">
    <div style="display: flex; justify-content: space-between; font-weight: 600; font-size: 14px;">
      <span>Overall Preparation Progress</span>
      <span id="progress-percent" style="color: var(--accent);">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- Controls Panel -->
  <div class="control-panel">
    <!-- Add Chapter Form -->
    <div class="panel-card">
      <h3>Add New Chapter</h3>
      <form id="add-chapter-form" onsubmit="addEntry(event)">
        <div class="form-grid">
          <input type="text" id="subject-input" placeholder="Subject (e.g., Physics)" required>
          <input type="text" id="book-input" placeholder="Book (e.g., NCERT)" required>
          <input type="text" id="chapter-input" placeholder="Chapter Name" required>
          <input type="date" id="date-input">
          <button type="submit" style="grid-column: 1 / -1; margin-top: 4px;">+ Add Chapter</button>
        </div>
      </form>
    </div>

    <!-- Filter & Backup Options -->
    <div class="panel-card" style="display: flex; flex-direction: column; justify-content: space-between;">
      <div>
        <h3>Filter & Search</h3>
        <div class="form-grid" style="margin-bottom: 12px;">
          <select id="filter-subject" onchange="renderTracker()">
            <option value="ALL">All Subjects</option>
          </select>
          <select id="filter-status" onchange="renderTracker()">
            <option value="ALL">All Statuses</option>
            <option value="DONE">Fully Completed</option>
            <option value="IN_PROGRESS">In Progress</option>
            <option value="NOT_STARTED">Not Started</option>
          </select>
          <input type="text" id="search-input" placeholder="Search chapter..." oninput="renderTracker()" style="grid-column: 1 / -1;">
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-secondary" onclick="exportData()" style="flex: 1;">Export Data</button>
        <button class="btn-secondary" onclick="document.getElementById('import-file').click()" style="flex: 1;">Import Data</button>
        <input type="file" id="import-file" style="display: none;" onchange="importData(event)" accept=".json">
      </div>
    </div>
  </div>

  <!-- Container for Subject Cards -->
  <div id="tracker-container"></div>

  <script>
    let studyData = JSON.parse(localStorage.getItem('studyTrackerProData')) || [];

    const STATUS_STATES = {
      0: { label: 'Not Started', class: 'status-not-done' },
      1: { label: 'In Progress', class: 'status-in-progress' },
      2: { label: 'Done', class: 'status-done' }
    };

    function saveData() {
      localStorage.setItem('studyTrackerProData', JSON.stringify(studyData));
      populateSubjectFilter();
      renderTracker();
    }

    function addEntry(e) {
      e.preventDefault();
      
      const subjectName = document.getElementById('subject-input').value.trim();
      const bookName = document.getElementById('book-input').value.trim();
      const chapterName = document.getElementById('chapter-input').value.trim();
      const targetDate = document.getElementById('date-input').value;

      if (!subjectName || !bookName || !chapterName) return;

      // Find or create Subject
      let subject = studyData.find(s => s.name.toLowerCase() === subjectName.toLowerCase());
      if (!subject) {
        subject = { id: 's_' + Date.now(), name: subjectName, books: [] };
        studyData.push(subject);
      }

      // Find or create Book
      let book = subject.books.find(b => b.name.toLowerCase() === bookName.toLowerCase());
      if (!book) {
        book = { id: 'b_' + Date.now(), name: bookName, chapters: [] };
        subject.books.push(book);
      }

      // Add Chapter
      const chapter = {
        id: 'c_' + Date.now(),
        name: chapterName,
        targetDate: targetDate || '',
        tasks: {
          notes: 0,
          revision: 0,
          questionPractice: 0,
          mockTest: 0,
          extraPractice: 0
        }
      };

      book.chapters.push(chapter);

      // Reset Chapter & Date Input
      document.getElementById('chapter-input').value = '';
      document.getElementById('date-input').value = '';

      saveData();
    }

    function cycleTaskStatus(subjectId, bookId, chapterId, taskKey) {
      const subject = studyData.find(s => s.id === subjectId);
      if (!subject) return;
      const book = subject.books.find(b => b.id === bookId);
      if (!book) return;
      const chapter = book.chapters.find(c => c.id === chapterId);
      if (!chapter) return;

      chapter.tasks[taskKey] = (chapter.tasks[taskKey] + 1) % 3;
      saveData();
    }

    function deleteChapter(subjectId, bookId, chapterId) {
      const subject = studyData.find(s => s.id === subjectId);
      if (!subject) return;
      const book = subject.books.find(b => b.id === bookId);
      if (!book) return;

      book.chapters = book.chapters.filter(c => c.id !== chapterId);

      if (book.chapters.length === 0) {
        subject.books = subject.books.filter(b => b.id !== bookId);
      }
      if (subject.books.length === 0) {
        studyData = studyData.filter(s => s.id !== subjectId);
      }

      saveData();
    }

    function deleteSubject(subjectId) {
      if (confirm('Delete this subject and all associated books and chapters?')) {
        studyData = studyData.filter(s => s.id !== subjectId);
        saveData();
      }
    }

    function populateSubjectFilter() {
      const filterSelect = document.getElementById('filter-subject');
      const currentValue = filterSelect.value;
      filterSelect.innerHTML = '<option value="ALL">All Subjects</option>';

      studyData.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject.id;
        option.textContent = subject.name;
        filterSelect.appendChild(option);
      });

      filterSelect.value = currentValue;
    }

    function getChapterOverallStatus(tasks) {
      const values = Object.values(tasks);
      if (values.every(v => v === 2)) return 'DONE';
      if (values.every(v => v === 0)) return 'NOT_STARTED';
      return 'IN_PROGRESS';
    }

    function updateStatsAndProgress() {
      let totalChapters = 0;
      let completedChapters = 0;
      let inProgressChapters = 0;

      let totalWeight = 0;
      let completedWeight = 0;

      studyData.forEach(s => {
        s.books.forEach(b => {
          b.chapters.forEach(c => {
            totalChapters++;
            const status = getChapterOverallStatus(c.tasks);
            if (status === 'DONE') completedChapters++;
            if (status === 'IN_PROGRESS') inProgressChapters++;

            Object.values(c.tasks).forEach(v => {
              totalWeight += 2;
              completedWeight += v;
            });
          });
        });
      });

      document.getElementById('stat-chapters').innerText = totalChapters;
      document.getElementById('stat-completed').innerText = completedChapters;
      document.getElementById('stat-progress').innerText = inProgressChapters;

      const percentage = totalWeight === 0 ? 0 : Math.round((completedWeight / totalWeight) * 100);
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('progress-percent').innerText = percentage + '%';
    }

    function renderTracker() {
      const container = document.getElementById('tracker-container');
      container.innerHTML = '';

      const selectedSubject = document.getElementById('filter-subject').value;
      const selectedStatus = document.getElementById('filter-status').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

      let hasVisibleData = false;

      studyData.forEach(subject => {
        if (selectedSubject !== 'ALL' && subject.id !== selectedSubject) return;

        let booksHTML = '';

        subject.books.forEach(book => {
          let chaptersHTML = '';

          book.chapters.forEach(chapter => {
            const matchesSearch = chapter.name.toLowerCase().includes(searchQuery);
            const chapterStatus = getChapterOverallStatus(chapter.tasks);
            const matchesStatus = selectedStatus === 'ALL' || chapterStatus === selectedStatus;

            if (matchesSearch && matchesStatus) {
              chaptersHTML += `
                <tr>
                  <td>
                    <strong>${chapter.name}</strong>
                    ${chapter.targetDate ? `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">📅 ${chapter.targetDate}</div>` : ''}
                  </td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'notes', chapter.tasks.notes)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'revision', chapter.tasks.revision)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'questionPractice', chapter.tasks.questionPractice)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'mockTest', chapter.tasks.mockTest)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'extraPractice', chapter.tasks.extraPractice)}</td>
                  <td>
                    <button class="btn-danger" onclick="deleteChapter('${subject.id}', '${book.id}', '${chapter.id}')">Remove</button>
                  </td>
                </tr>
              `;
            }
          });

          if (chaptersHTML !== '') {
            hasVisibleData = true;
            booksHTML += `
              <div class="book-block">
                <div class="book-title">📖 Book: ${book.name}</div>
                <div class="table-responsive">
                  <table>
                    <thead>
                      <tr>
                        <th>Chapter Name</th>
                        <th>Notes</th>
                        <th>Revision</th>
                        <th>Q-Practice</th>
                        <th>Mock Test</th>
                        <th>Extra Practice</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>${chaptersHTML}</tbody>
                  </table>
                </div>
              </div>
            `;
          }
        });

        if (booksHTML !== '') {
          const subjectEl = document.createElement('div');
          subjectEl.className = 'subject-card';
          subjectEl.innerHTML = `
            <div class="subject-header">
              <h2>📚 ${subject.name}</h2>
              <button class="btn-danger" onclick="deleteSubject('${subject.id}')">Delete Subject</button>
            </div>
            ${booksHTML}
          `;
          container.appendChild(subjectEl);
        }
      });

      if (!hasVisibleData) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 30px;">No chapters found. Add a new chapter above to start tracking!</p>`;
      }

      updateStatsAndProgress();
    }

    function renderStatusBtn(subjectId, bookId, chapterId, taskKey, statusVal) {
      const stateInfo = STATUS_STATES[statusVal || 0];
      return `<button class="status-btn ${stateInfo.class}" onclick="cycleTaskStatus('${subjectId}', '${bookId}', '${chapterId}', '${taskKey}')">${stateInfo.label}</button>`;
    }

    // Export Data as JSON
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(studyData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `study_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // Import Data from JSON
    function importData(e) {
      const fileReader = new FileReader();
      fileReader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            studyData = imported;
            saveData();
            alert('Study data imported successfully!');
          }
        } catch (err) {
          alert('Invalid JSON file format.');
        }
      };
      if (e.target.files[0]) {
        fileReader.readAsText(e.target.files[0]);
      }
    }

    // Initialize
    populateSubjectFilter();
    renderTracker();
  </script>
</body>
</html>
