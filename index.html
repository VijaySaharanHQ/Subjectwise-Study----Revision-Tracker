<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Study & Revision Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 8px;
    }

    .progress-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .progress-bar-container {
      background-color: #334155;
      border-radius: 9999px;
      height: 12px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      background-color: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .form-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .form-container input, .form-container select, button {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .form-container input:focus, .form-container select:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .subject-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .subject-header {
      background-color: #1e293b;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-block {
      padding: 16px;
      border-bottom: 1px dashed var(--border-color);
    }

    .book-block:last-child {
      border-bottom: none;
    }

    .book-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-btn {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 90px;
      text-align: center;
    }

    .status-done {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .status-not-done {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>

  <header>
    <h1>Study Tracker</h1>
    <p style="color: var(--text-muted);">Track your subjects, books, and chapter milestones</p>
  </header>

  <div class="progress-wrapper">
    <div style="display: flex; justify-content: space-between; font-weight: 600;">
      <span>Overall Preparation Progress</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="form-container">
    <input type="text" id="subject-input" placeholder="Subject Name (e.g., Physics)" style="flex: 1; min-width: 150px;">
    <input type="text" id="book-input" placeholder="Book Name (e.g., NCERT)" style="flex: 1; min-width: 150px;">
    <input type="text" id="chapter-input" placeholder="Chapter Name" style="flex: 1; min-width: 150px;">
    <button onclick="addEntry()">Add Chapter</button>
  </div>

  <div id="tracker-container"></div>

  <script>
    let studyData = JSON.parse(localStorage.getItem('studyTrackerData')) || [];

    function saveData() {
      localStorage.setItem('studyTrackerData', JSON.stringify(studyData));
      renderTracker();
    }

    function addEntry() {
      const subjectName = document.getElementById('subject-input').value.trim();
      const bookName = document.getElementById('book-input').value.trim();
      const chapterName = document.getElementById('chapter-input').value.trim();

      if (!subjectName || !bookName || !chapterName) {
        alert('Please fill in Subject, Book, and Chapter fields.');
        return;
      }

      let subject = studyData.find(s => s.name.toLowerCase() === subjectName.toLowerCase());
      if (!subject) {
        subject = { id: Date.now().toString(), name: subjectName, books: [] };
        studyData.push(subject);
      }

      let book = subject.books.find(b => b.name.toLowerCase() === bookName.toLowerCase());
      if (!book) {
        book = { id: Date.now().toString(), name: bookName, chapters: [] };
        subject.books.push(book);
      }

      const chapter = {
        id: Date.now().toString(),
        name: chapterName,
        tasks: {
          notes: false,
          revision: false,
          questionPractice: false,
          mockTest: false,
          extraPractice: false
        }
      };

      book.chapters.push(chapter);

      document.getElementById('chapter-input').value = '';
      saveData();
    }

    function toggleTaskStatus(subjectId, bookId, chapterId, taskKey) {
      const subject = studyData.find(s => s.id === subjectId);
      if (!subject) return;
      const book = subject.books.find(b => b.id === bookId);
      if (!book) return;
      const chapter = book.chapters.find(c => c.id === chapterId);
      if (!chapter) return;

      chapter.tasks[taskKey] = !chapter.tasks[taskKey];
      saveData();
    }

    function deleteChapter(subjectId, bookId, chapterId) {
      const subject = studyData.find(s => s.id === subjectId);
      const book = subject.books.find(b => b.id === bookId);
      book.chapters = book.chapters.filter(c => c.id !== chapterId);

      if (book.chapters.length === 0) {
        subject.books = subject.books.filter(b => b.id !== bookId);
      }
      if (subject.books.length === 0) {
        studyData = studyData.filter(s => s.id !== subjectId);
      }

      saveData();
    }

    function deleteSubject(subjectId) {
      studyData = studyData.filter(s => s.id !== subjectId);
      saveData();
    }

    function updateProgress() {
      let totalTasks = 0;
      let completedTasks = 0;

      studyData.forEach(s => {
        s.books.forEach(b => {
          b.chapters.forEach(c => {
            Object.values(c.tasks).forEach(isDone => {
              totalTasks++;
              if (isDone) completedTasks++;
            });
          });
        });
      });

      const percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('progress-percent').innerText = percentage + '%';
    }

    function renderTracker() {
      const container = document.getElementById('tracker-container');
      container.innerHTML = '';

      if (studyData.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">No subjects added yet. Add a chapter above to begin tracking.</p>`;
        updateProgress();
        return;
      }

      studyData.forEach(subject => {
        const subjectEl = document.createElement('div');
        subjectEl.className = 'subject-card';

        let booksHTML = '';

        subject.books.forEach(book => {
          let chaptersHTML = '';

          book.chapters.forEach(chapter => {
            chaptersHTML += `
              <tr>
                <td><strong>${chapter.name}</strong></td>
                <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'notes', chapter.tasks.notes)}</td>
                <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'revision', chapter.tasks.revision)}</td>
                <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'questionPractice', chapter.tasks.questionPractice)}</td>
                <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'mockTest', chapter.tasks.mockTest)}</td>
                <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'extraPractice', chapter.tasks.extraPractice)}</td>
                <td>
                  <button class="btn-danger" onclick="deleteChapter('${subject.id}', '${book.id}', '${chapter.id}')">Remove</button>
                </td>
              </tr>
            `;
          });

          booksHTML += `
            <div class="book-block">
              <div class="book-title">
                <span>Book: ${book.name}</span>
              </div>
              <div class="table-responsive">
                <table>
                  <thead>
                    <tr>
                      <th>Chapter Name</th>
                      <th>Notes</th>
                      <th>Revision</th>
                      <th>Q-Practice</th>
                      <th>Mock Test</th>
                      <th>Extra Practice</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${chaptersHTML}
                  </tbody>
                </table>
              </div>
            </div>
          `;
        });

        subjectEl.innerHTML = `
          <div class="subject-header">
            <h2>${subject.name}</h2>
            <button class="btn-danger" onclick="deleteSubject('${subject.id}')">Delete Subject</button>
          </div>
          ${booksHTML}
        `;

        container.appendChild(subjectEl);
      });

      updateProgress();
    }

    function renderStatusBtn(subjectId, bookId, chapterId, taskKey, isDone) {
      const label = isDone ? 'Done' : 'Not Done';
      const className = isDone ? 'status-done' : 'status-not-done';
      return `<button class="status-btn ${className}" onclick="toggleTaskStatus('${subjectId}', '${bookId}', '${chapterId}', '${taskKey}')">${label}</button>`;
    }

    // Initial Render
    renderTracker();
  </script>
</body>
</html>
