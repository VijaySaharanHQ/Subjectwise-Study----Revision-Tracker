<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subject Study & Revision Tracker</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 8px;
    }

    .progress-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .progress-bar-container {
      background-color: #334155;
      border-radius: 9999px;
      height: 12px;
      overflow: hidden;
      margin-top: 8px;
    }

    .progress-bar-fill {
      background-color: var(--success);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .control-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .control-panel {
        grid-template-columns: 1fr 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .card h3 {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input, select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #0f172a;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    button {
      background-color: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .btn-danger {
      background-color: var(--danger);
      color: #fff;
      padding: 4px 8px;
      font-size: 12px;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .subject-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .subject-header {
      background-color: #1e293b;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .book-block {
      padding: 16px;
      border-bottom: 1px dashed var(--border-color);
    }

    .book-block:last-child {
      border-bottom: none;
    }

    .book-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-btn {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      width: 105px;
      text-align: center;
    }

    .status-not-done {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid var(--danger);
    }

    .status-in-progress {
      background-color: rgba(234, 179, 8, 0.2);
      color: #fde047;
      border: 1px solid var(--warning);
    }

    .status-done {
      background-color: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid var(--success);
    }
  </style>
</head>
<body>

  <header>
    <h1>Study Tracker</h1>
    <p style="color: var(--text-muted);">Track and filter your chapter milestones</p>
  </header>

  <div class="progress-wrapper">
    <div style="display: flex; justify-content: space-between; font-weight: 600;">
      <span>Overall Preparation Progress</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div class="control-panel">
    <!-- Add New Chapter Form -->
    <div class="card">
      <h3>Add New Chapter</h3>
      <div class="form-group">
        <input type="text" id="subject-input" placeholder="Subject (e.g. Math)" style="flex: 1; min-width: 120px;">
        <input type="text" id="book-input" placeholder="Book (e.g. RD Sharma)" style="flex: 1; min-width: 120px;">
        <input type="text" id="chapter-input" placeholder="Chapter Name" style="flex: 1; min-width: 120px;">
        <button onclick="addEntry()">Add</button>
      </div>
    </div>

    <!-- Filter Options -->
    <div class="card">
      <h3>Filter Chapters</h3>
      <div class="form-group">
        <select id="filter-subject" onchange="renderTracker()" style="flex: 1; min-width: 110px;">
          <option value="ALL">All Subjects</option>
        </select>
        <select id="filter-status" onchange="renderTracker()" style="flex: 1; min-width: 110px;">
          <option value="ALL">All Statuses</option>
          <option value="DONE">Fully Completed</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="NOT_STARTED">Not Started</option>
        </select>
        <input type="text" id="search-input" placeholder="Search chapter..." oninput="renderTracker()" style="flex: 1; min-width: 120px;">
      </div>
    </div>
  </div>

  <div id="tracker-container"></div>

  <script>
    let studyData = JSON.parse(localStorage.getItem('studyTrackerData')) || [];

    // State options mapping
    const STATUS_STATES = {
      0: { label: 'Not Started', class: 'status-not-done' },
      1: { label: 'In Progress', class: 'status-in-progress' },
      2: { label: 'Done', class: 'status-done' }
    };

    function saveData() {
      localStorage.setItem('studyTrackerData', JSON.stringify(studyData));
      populateSubjectFilter();
      renderTracker();
    }

    function addEntry() {
      const subjectName = document.getElementById('subject-input').value.trim();
      const bookName = document.getElementById('book-input').value.trim();
      const chapterName = document.getElementById('chapter-input').value.trim();

      if (!subjectName || !bookName || !chapterName) {
        alert('Please fill in Subject, Book, and Chapter fields.');
        return;
      }

      let subject = studyData.find(s => s.name.toLowerCase() === subjectName.toLowerCase());
      if (!subject) {
        subject = { id: Date.now().toString(), name: subjectName, books: [] };
        studyData.push(subject);
      }

      let book = subject.books.find(b => b.name.toLowerCase() === bookName.toLowerCase());
      if (!book) {
        book = { id: Date.now().toString(), name: bookName, chapters: [] };
        subject.books.push(book);
      }

      // Tasks initialized with state 0 (Not Started)
      const chapter = {
        id: Date.now().toString(),
        name: chapterName,
        tasks: {
          notes: 0,
          revision: 0,
          questionPractice: 0,
          mockTest: 0,
          extraPractice: 0
        }
      };

      book.chapters.push(chapter);

      document.getElementById('chapter-input').value = '';
      saveData();
    }

    function cycleTaskStatus(subjectId, bookId, chapterId, taskKey) {
      const subject = studyData.find(s => s.id === subjectId);
      if (!subject) return;
      const book = subject.books.find(b => b.id === bookId);
      if (!book) return;
      const chapter = book.chapters.find(c => c.id === chapterId);
      if (!chapter) return;

      // Ensure backward compatibility if data was boolean
      if (typeof chapter.tasks[taskKey] === 'boolean') {
        chapter.tasks[taskKey] = chapter.tasks[taskKey] ? 2 : 0;
      }

      // Cycle between 0 -> 1 -> 2 -> 0
      chapter.tasks[taskKey] = (chapter.tasks[taskKey] + 1) % 3;
      saveData();
    }

    function deleteChapter(subjectId, bookId, chapterId) {
      const subject = studyData.find(s => s.id === subjectId);
      const book = subject.books.find(b => b.id === bookId);
      book.chapters = book.chapters.filter(c => c.id !== chapterId);

      if (book.chapters.length === 0) {
        subject.books = subject.books.filter(b => b.id !== bookId);
      }
      if (subject.books.length === 0) {
        studyData = studyData.filter(s => s.id !== subjectId);
      }

      saveData();
    }

    function deleteSubject(subjectId) {
      studyData = studyData.filter(s => s.id !== subjectId);
      saveData();
    }

    function populateSubjectFilter() {
      const filterSelect = document.getElementById('filter-subject');
      const currentValue = filterSelect.value;
      filterSelect.innerHTML = '<option value="ALL">All Subjects</option>';

      studyData.forEach(subject => {
        const option = document.createElement('option');
        option.value = subject.id;
        option.textContent = subject.name;
        filterSelect.appendChild(option);
      });

      filterSelect.value = currentValue;
    }

    function getChapterOverallStatus(tasks) {
      const values = Object.values(tasks).map(v => typeof v === 'boolean' ? (v ? 2 : 0) : v);
      const isAllDone = values.every(val => val === 2);
      if (isAllDone) return 'DONE';
      
      const isAllNotStarted = values.every(val => val === 0);
      if (isAllNotStarted) return 'NOT_STARTED';

      return 'IN_PROGRESS';
    }

    function updateProgress() {
      let totalWeight = 0;
      let completedWeight = 0;

      studyData.forEach(s => {
        s.books.forEach(b => {
          b.chapters.forEach(c => {
            Object.values(c.tasks).forEach(statusVal => {
              const val = typeof statusVal === 'boolean' ? (statusVal ? 2 : 0) : statusVal;
              totalWeight += 2; // Max weight per task state is 2 (Done)
              completedWeight += val;
            });
          });
        });
      });

      const percentage = totalWeight === 0 ? 0 : Math.round((completedWeight / totalWeight) * 100);
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('progress-percent').innerText = percentage + '%';
    }

    function renderTracker() {
      const container = document.getElementById('tracker-container');
      container.innerHTML = '';

      const selectedSubject = document.getElementById('filter-subject').value;
      const selectedStatus = document.getElementById('filter-status').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

      let hasVisibleData = false;

      studyData.forEach(subject => {
        if (selectedSubject !== 'ALL' && subject.id !== selectedSubject) return;

        let booksHTML = '';

        subject.books.forEach(book => {
          let chaptersHTML = '';

          book.chapters.forEach(chapter => {
            const matchesSearch = chapter.name.toLowerCase().includes(searchQuery);
            const chapterStatus = getChapterOverallStatus(chapter.tasks);
            const matchesStatus = selectedStatus === 'ALL' || chapterStatus === selectedStatus;

            if (matchesSearch && matchesStatus) {
              chaptersHTML += `
                <tr>
                  <td><strong>${chapter.name}</strong></td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'notes', chapter.tasks.notes)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'revision', chapter.tasks.revision)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'questionPractice', chapter.tasks.questionPractice)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'mockTest', chapter.tasks.mockTest)}</td>
                  <td>${renderStatusBtn(subject.id, book.id, chapter.id, 'extraPractice', chapter.tasks.extraPractice)}</td>
                  <td>
                    <button class="btn-danger" onclick="deleteChapter('${subject.id}', '${book.id}', '${chapter.id}')">Remove</button>
                  </td>
                </tr>
              `;
            }
          });

          if (chaptersHTML !== '') {
            hasVisibleData = true;
            booksHTML += `
              <div class="book-block">
                <div class="book-title">
                  <span>Book: ${book.name}</span>
                </div>
                <div class="table-responsive">
                  <table>
                    <thead>
                      <tr>
                        <th>Chapter Name</th>
                        <th>Notes</th>
                        <th>Revision</th>
                        <th>Q-Practice</th>
                        <th>Mock Test</th>
                        <th>Extra Practice</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${chaptersHTML}
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          }
        });

        if (booksHTML !== '') {
          const subjectEl = document.createElement('div');
          subjectEl.className = 'subject-card';
          subjectEl.innerHTML = `
            <div class="subject-header">
              <h2>${subject.name}</h2>
              <button class="btn-danger" onclick="deleteSubject('${subject.id}')">Delete Subject</button>
            </div>
            ${booksHTML}
          `;
          container.appendChild(subjectEl);
        }
      });

      if (!hasVisibleData) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">No chapters found matching the selected criteria.</p>`;
      }

      updateProgress();
    }

    function renderStatusBtn(subjectId, bookId, chapterId, taskKey, rawStatus) {
      // Normalize legacy boolean values to state integers
      let statusVal = typeof rawStatus === 'boolean' ? (rawStatus ? 2 : 0) : rawStatus;
      if (statusVal === undefined) statusVal = 0;

      const stateInfo = STATUS_STATES[statusVal];
      return `<button class="status-btn ${stateInfo.class}" onclick="cycleTaskStatus('${subjectId}', '${bookId}', '${chapterId}', '${taskKey}')">${stateInfo.label}</button>`;
    }

    // Initial setup
    populateSubjectFilter();
    renderTracker();
  </script>
</body>
</html>
